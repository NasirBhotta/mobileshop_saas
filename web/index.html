<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nizaaam mobile shop management">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nizaaam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Nizaaam</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #F7F5F0;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #F7F5F0;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .splash-logo {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      object-fit: contain;
    }

    .splash-loader {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(14, 111, 78, 0.18);
      border-top-color: #0E6F4E;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-loader { animation: none; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Nizaaam">
    <div class="splash-content">
      <img class="splash-logo" src="icons/Icon-192.png" alt="Nizaaam">
      <div class="splash-loader" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
